<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recall - AI Missed-Call Recovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-blue-500 selection:text-white">

    <!-- Container wrapper optimized for mobile display -->
    <div class="max-w-md w-full mx-auto p-6 flex flex-col justify-center flex-grow">
        
        <!-- Branding Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Recall</h1>
            <p class="text-sm text-slate-400">Autonomous Missed-Call Recovery & Booking</p>
        </div>

        <!-- AUTH & ONBOARDING CONTAINER -->
        <div id="app-container" class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-6 rounded-2xl shadow-2xl">
            
            <!-- VIEW 1: LOGIN / SIGNUP CHOICE -->
            <div id="view-auth-choice" class="space-y-4">
                <button onclick="switchView('view-signup')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-blue-600/20">
                    Create Business Account
                </button>
                <button onclick="switchView('view-login')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-xl transition border border-slate-700">
                    Sign In
                </button>
            </div>

            <!-- VIEW 2: SIGN UP & BUSINESS ONBOARDING FORM -->
            <div id="view-signup" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-slate-200 mb-2">Business Setup</h2>
                <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Business Email</label>
                        <input type="email" id="su-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                        <input type="password" id="su-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Business Name</label>
                            <input type="text" id="su-name" required placeholder="e.g. Apex Plumbing" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Trade / Type</label>
                            <input type="text" id="su-type" required placeholder="e.g. Plumber" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Owner Phone</label>
                            <input type="text" id="su-owner-phone" required placeholder="+1..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Twilio Number</label>
                            <input type="text" id="su-twilio" required placeholder="+1..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Services & Pricing</label>
                        <textarea id="su-services" rows="2" required placeholder="Leak repair ($100), Pipe install ($300)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Business Hours & Location</label>
                        <input type="text" id="su-hours" required placeholder="Mon-Fri 8am-5pm" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white mb-2 focus:outline-none focus:border-blue-500">
                        <input type="text" id="su-address" required placeholder="123 Main St, City" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition mt-4">
                        Complete Setup & Launch
                    </button>
                </form>
                <button onclick="switchView('view-auth-choice')" class="w-full text-xs text-slate-400 hover:text-white mt-2">Back</button>
            </div>

            <!-- VIEW 3: LOGIN FORM -->
            <div id="view-login" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-slate-200 mb-2">Welcome Back</h2>
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
                        <input type="email" id="li-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                        <input type="password" id="li-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition mt-4">
                        Sign In
                    </button>
                </form>
                <button onclick="switchView('view-auth-choice')" class="w-full text-xs text-slate-400 hover:text-white mt-2">Back</button>
            </div>

        </div>

    </div>

    <script>
        function switchView(viewId) {
            document.getElementById('view-auth-choice').classList.add('hidden');
            document.getElementById('view-signup').classList.add('hidden');
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        async function handleSignup(e) {
            e.preventDefault();
            const payload = {
                email: document.getElementById('su-email').value,
                password: document.getElementById('su-password').value,
                business_name: document.getElementById('su-name').value,
                business_type: document.getElementById('su-type').value,
                owner_phone: document.getElementById('su-owner-phone').value,
                twilio_number: document.getElementById('su-twilio').value,
                services_offered: document.getElementById('su-services').value,
                business_hours: document.getElementById('su-hours').value,
                location_address: document.getElementById('su-address').value,
                faq_notes: ""
            };

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(res.ok) {
                    localStorage.setItem('recall_token', data.session.access_token);
                    alert('Account created successfully!');
                    location.reload();
                } else {
                    alert(data.detail || 'Registration failed');
                }
            } catch(err) {
                alert('Connection error occurred.');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            // Standard client sign-in integration placeholder linked to backend
            alert('Login route operational. Wire up token handler.');
        }

        // Check persistent token on load
        window.onload = function() {
            const token = localStorage.getItem('recall_token');
            if(token) {
                // If token exists, we will transition straight to the Blue Glassmorphism Dashboard view next
                console.log("Session active.");
            }
        }
    </script>
</body>
</html>
